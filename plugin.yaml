id: mikrotik
name: MikroTik RouterOS
version: 0.1.0
protocol: 1
entrypoint: main.py
timeout_s: 60
description: >-
  MikroTik routers, switches and access points through the RouterOS v7 REST
  API: ports with link speed, traffic, SFP diagnostics and VLANs, bridge MAC
  table, ARP, DHCP leases, MNDP/LLDP/CDP neighbors, Wi-Fi clients, default
  gateways, CPU, memory, temperatures and pending updates. Read-only.
author: Omini
homepage: https://github.com/riccardoalv/omini-plugin-mikrotik
fields:
  - key: url
    type: url
    label: Address
    required: true
    help: The router's HTTPS address (the www-ssl service), e.g. https://192.168.88.1
  - key: username
    type: string
    label: Username
    required: true
    help: >-
      A user in a read-only group (policy read, api, rest-api): see the
      plugin's README.
  - key: password
    type: secret
    label: Password
    required: true
  - key: verify_tls
    type: bool
    label: Verify the TLS certificate
    default: false
    help: RouterOS uses a self-signed certificate unless you installed a trusted one.
