id: mikrotik
name: MikroTik RouterOS
version: 0.2.0
protocol: 1
entrypoint: main.py
timeout_s: 60
description: >-
  MikroTik routers, switches and access points through the RouterOS v7 REST
  API: ports with link speed, traffic, SFP diagnostics and VLANs, bridge MAC
  table, ARP, DHCP leases, MNDP/LLDP/CDP neighbors, Wi-Fi clients, default
  gateways, CPU, memory, temperatures and pending updates, and enables or
  disables Ethernet ports (applied, then checked; RouterOS keeps it).
author: Omini
homepage: https://github.com/riccardoalv/omini-plugin-mikrotik
changes:
  - port.enabled
fields:
  - key: url
    type: url
    label: Address
    required: true
    help: The router's HTTPS address (the www-ssl service), e.g. https://192.168.88.1
  - key: username
    type: string
    label: Username
    required: true
    help: >-
      A user whose group has the policies read, write, api and rest-api (write
      is needed only to enable or disable ports): see the plugin's README.
  - key: password
    type: secret
    label: Password
    required: true
  - key: verify_tls
    type: bool
    label: Verify the TLS certificate
    default: false
    help: RouterOS uses a self-signed certificate unless you installed a trusted one.
