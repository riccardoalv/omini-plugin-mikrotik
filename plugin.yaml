id: mikrotik
name: MikroTik RouterOS
version: 0.3.0
protocol: 1
entrypoint: main.py
timeout_s: 60
description: >-
  MikroTik routers, switches and access points through the RouterOS v7 REST
  API: ports with link speed, traffic, SFP diagnostics and VLANs, bridge MAC
  table, ARP, DHCP leases, MNDP/LLDP/CDP neighbors, Wi-Fi clients, default
  gateways, CPU, memory, temperatures and pending updates. It changes, when
  asked: Ethernet ports on or off, a bridge port's VLANs and the bridge's
  VLANs (VLAN filtering must be on), and a router's VLAN networks (interface,
  gateway, DHCP, access rules, mDNS), DHCP reservations, local DNS names
  and paused devices (no internet); it sends Wake-on-LAN packets. Each change
  is read back and undone if RouterOS did not take it. It also reads STP
  port roles, bonds and the configuration (/export, without sensitive values)
  for Omini's history.
author: Omini
homepage: https://github.com/riccardoalv/omini-plugin-mikrotik
changes:
  - port.enabled
  - port.vlans
  - vlan.set
  - vlan.delete
  - network.set
  - network.delete
  - reservation.set
  - reservation.delete
  - dns.set
  - dns.delete
  - wol.send
  - pause.set
  - pause.delete
backup: true
fields:
  - key: url
    type: url
    label: Address
    required: true
    help: The router's HTTPS address (the www-ssl service), e.g. https://192.168.88.1
  - key: username
    type: string
    label: Username
    required: true
    help: >-
      A user whose group has the policies read, write, api and rest-api (write
      is needed only for changes): see the plugin's README.
  - key: password
    type: secret
    label: Password
    required: true
  - key: verify_tls
    type: bool
    label: Verify the TLS certificate
    default: false
    help: RouterOS uses a self-signed certificate unless you installed a trusted one.
